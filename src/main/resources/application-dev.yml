server:
  port: 20999
spring:
  application:
    name: github_manager_dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 30000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show-sql: true
        jdbc:
          batch_size: 100
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
        stat: DEBUG
        orm:
          results: TRACE
github-sync-executor:
  core-pool-size: 1
  maximum-pool-size: 3
  queue-capacity: 100
  thread-name-prefix: "GithubSyncWorkerDev-"
clients:
  github-service:
    base-url: https://api.github.com
    repos: ${OWNED_GITHUB_REPOS}
    connect-timeout: 3s
    read-timeout: 10s
    access-token: ${GITHUB_ACCESS_TOKEN}
    get-repositories-path: "/user/repos"
    page-size: 100
    media-type: "application/vnd.github+json"
    path: "/user/repos"
    affiliation: "owner"
    api-version: "2022-11-28"
